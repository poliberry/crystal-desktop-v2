appId: dev.crystal.desktop
productName: Crystal
copyright: Copyright © 2026 Crystal
directories:
  output: release
publish:
  provider: github
  owner: poliberry
  repo: crystal-desktop-v2
files:
  - dist-electron/**
  - out/**
  - package.json
  # The main process runs a local static server at runtime (see
  # electron/main.ts) via serve-handler. Listing its full dependency tree
  # explicitly (rather than all of node_modules) keeps devDependencies like
  # electron/typescript themselves out of the packaged app.
  - node_modules/serve-handler/**
  - node_modules/bytes/**
  - node_modules/content-disposition/**
  - node_modules/mime-types/**
  - node_modules/mime-db/**
  - node_modules/minimatch/**
  - node_modules/brace-expansion/**
  - node_modules/balanced-match/**
  - node_modules/concat-map/**
  - node_modules/path-is-inside/**
  - node_modules/path-to-regexp/**
  - node_modules/range-parser/**
  # electron-updater's runtime dependency tree, for the same reason.
  - node_modules/electron-updater/**
  - node_modules/builder-util-runtime/**
  - node_modules/fs-extra/**
  - node_modules/graceful-fs/**
  - node_modules/jsonfile/**
  - node_modules/universalify/**
  - node_modules/js-yaml/**
  - node_modules/argparse/**
  - node_modules/lazy-val/**
  - node_modules/lodash.escaperegexp/**
  - node_modules/lodash.isequal/**
  - node_modules/semver/**
  - node_modules/tiny-typed-emitter/**
  - node_modules/debug/**
  - node_modules/sax/**
  - node_modules/ms/**
asarUnpack:
  - resources/**
mac:
  category: public.app-category.social-networking
  extraResources:
    - from: native/SystemAudioCapture/.build/release/CrystalSystemAudio
      to: CrystalSystemAudio
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Network
  maintainer: crystal
  syncDesktopName: true
