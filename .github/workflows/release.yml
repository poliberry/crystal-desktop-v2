name: Release

on:
  push:
    branches: [main]

# Serialize runs for main: if one is already in progress when a new push
# arrives, the new run waits instead of racing it. If several pushes queue
# up while one is running, only the most recently queued run survives
# (GitHub cancels the older *pending* ones automatically) — the in-progress
# run is never killed mid-publish, so a release never ends up with assets
# from two different commits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}

jobs:
  # Decide whether this push already carries an unreleased version (in which
  # case it should be built and published) or whether it's still sitting on
  # the last-released version (in which case we need to propose the next
  # one via a PR before anything gets built).
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_release: ${{ steps.compare.outputs.needs_release }}
      current_version: ${{ steps.compare.outputs.current_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compare current version to latest release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          LATEST="$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//')"
          echo "current version: $CURRENT, latest released: ${LATEST:-<none>}"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"

  # No unreleased version pending: open (or update) a bot-authored PR that
  # bumps package.json. Merging it is what actually triggers a release, so
  # main only ever gets a new version through a reviewable PR, never a
  # direct bot push.
  bump-pr:
    needs: check
    if: needs.check.outputs.needs_release == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open version bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          # poliberry's org policy blocks the default GITHUB_TOKEN from
          # creating pull requests, so this step needs a PAT instead — see
          # the RELEASE_PAT secret set up in repo Settings > Secrets and
          # variables > Actions (fine-grained PAT scoped to this repo,
          # Contents: read/write + Pull requests: read/write).
          token: ${{ secrets.RELEASE_PAT }}
          commit-message: "chore: bump version to v${{ steps.bump.outputs.version }}"
          title: "chore: bump version to v${{ steps.bump.outputs.version }}"
          body: |
            Automated version bump — the current release (`v${{ needs.check.outputs.current_version }}`) is already published, so this proposes the next one.

            Merging this PR is what triggers the build & publish workflow for `v${{ steps.bump.outputs.version }}`.
          branch: chore/bump-version
          base: main
          delete-branch: true
          labels: version-bump

  # An unreleased version is already on main (i.e. a bump PR was just
  # merged) — build installers for it.
  build:
    needs: check
    if: needs.check.outputs.needs_release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-glob: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            target: win
            artifact-glob: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Package (${{ matrix.target }})
        run: bunx electron-builder --${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.current_version }}
          name: v${{ needs.check.outputs.current_version }}
          files: dist/**/*
