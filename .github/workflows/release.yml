name: Release

# One workflow, four channels. Each branch publishes its own installers and its
# own update feed, and each channel is a separate application (own appId,
# product name and icon — see electron/channels.ts) so they install side by
# side:
#
#   main         -> Stable       tags v1.2.3            (the repo's "latest")
#   ptb          -> PTB          tags ptb-1.2.3         (prerelease)
#   canary       -> Canary       tags canary-1.2.3      (prerelease)
#   development  -> Development  tags development-1.2.3 (prerelease)
#
# `main` *is* the Stable branch — it's the default branch and what PRs target,
# so a separate `stable` branch would only be a second name for the same tip.
#
# Work is expected to flow development -> canary -> ptb -> main; each branch
# carries its own version in package.json, so a promotion PR resolves that one
# field. A channel only ever compares against its own releases, so version
# numbers don't need to line up between them.
on:
  push:
    branches: [main, ptb, canary, development]

# Serialize runs per branch: if one is already in progress when a new push
# arrives, the new run waits instead of racing it. If several pushes queue
# up while one is running, only the most recently queued run survives
# (GitHub cancels the older *pending* ones automatically) — the in-progress
# run is never killed mid-publish, so a release never ends up with assets
# from two different commits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}

jobs:
  # Work out which channel this branch publishes, then whether this push
  # already carries an unreleased version (build and publish it) or is still
  # sitting on the version this channel last released (propose the next one via
  # a PR before anything gets built).
  check:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      channel_label: ${{ steps.channel.outputs.channel_label }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      tag: ${{ steps.channel.outputs.tag }}
      current_version: ${{ steps.channel.outputs.current_version }}
      needs_release: ${{ steps.compare.outputs.needs_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # The branch -> channel mapping and the tag prefixes are mirrored from
      # electron/channels.ts, which can't be required here (it hasn't been
      # compiled yet). The build job asserts the two agree before packaging
      # anything, so a change to one and not the other fails loudly.
      - name: Resolve channel
        id: channel
        run: |
          case "${{ github.ref_name }}" in
            main)        CHANNEL=stable;      LABEL=Stable;      PREFIX=v ;;
            ptb)         CHANNEL=ptb;         LABEL=PTB;         PREFIX=ptb- ;;
            canary)      CHANNEL=canary;      LABEL=Canary;      PREFIX=canary- ;;
            development) CHANNEL=development; LABEL=Development; PREFIX=development- ;;
            *)
              echo "::error::No release channel is mapped to ${{ github.ref_name }}."
              exit 1 ;;
          esac
          VERSION="$(node -p "require('./package.json').version")"
          # Stable's plain vX.Y.Z tags are what GitHub reports as the repo's
          # latest release, which is where a Stable install looks for updates.
          # Everything else is a prerelease so it stays out of that answer.
          if [ "$CHANNEL" = "stable" ]; then PRERELEASE=false; else PRERELEASE=true; fi
          {
            echo "channel=$CHANNEL"
            echo "channel_label=$LABEL"
            echo "prerelease=$PRERELEASE"
            echo "tag=${PREFIX}${VERSION}"
            echo "current_version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "$LABEL channel, version $VERSION, tag ${PREFIX}${VERSION}"

      # Per-channel rather than "compare against the newest release in the
      # repo": Canary and Stable version independently, so the only question
      # that matters is whether *this* tag has been published.
      - name: Has this version already been released?
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published — a version bump is needed first."
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG has not been published yet — building it."
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

  # This channel's current version is already published: open (or update) a
  # bot-authored PR that bumps package.json on this branch. Merging it is what
  # actually triggers a release, so a branch only ever gets a new version
  # through a reviewable PR, never a direct bot push.
  bump-pr:
    needs: check
    if: needs.check.outputs.needs_release == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open version bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          # poliberry's org policy blocks the default GITHUB_TOKEN from
          # creating pull requests, so this step needs a PAT instead — see
          # the RELEASE_PAT secret set up in repo Settings > Secrets and
          # variables > Actions (fine-grained PAT scoped to this repo,
          # Contents: read/write + Pull requests: read/write).
          token: ${{ secrets.RELEASE_PAT }}
          commit-message: "chore: bump ${{ needs.check.outputs.channel }} version to ${{ steps.bump.outputs.version }}"
          title: "chore: bump ${{ needs.check.outputs.channel_label }} version to ${{ steps.bump.outputs.version }}"
          body: |
            Automated version bump for the **${{ needs.check.outputs.channel_label }}** channel — its current release (`${{ needs.check.outputs.tag }}`) is already published, so this proposes the next one.

            Merging this PR is what triggers the build & publish workflow for `${{ needs.check.outputs.channel }}` v${{ steps.bump.outputs.version }}.
          # One branch per channel: four channels bumping through a shared
          # branch would overwrite each other's proposal.
          branch: chore/bump-${{ needs.check.outputs.channel }}-version
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: |
            version-bump
            channel:${{ needs.check.outputs.channel }}

  # An unreleased version is on the branch (i.e. a bump PR was just merged) —
  # build this channel's installers for it.
  build:
    needs: check
    if: needs.check.outputs.needs_release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            # *.yml/*.blockmap are electron-updater's update-metadata files
            # (latest-linux.yml + AppImage blockmap) — without them on the
            # release, the auto-updater has nothing to check against.
            #
            # builder-debug.yml is excluded because electron-builder writes one
            # per platform under the same name: both jobs upload it, the
            # release step then tries to *update* an asset that's still being
            # created, and 404s. It's an electron-builder dump nothing reads,
            # so the fix is to not ship it rather than to de-duplicate it.
            artifact-glob: |
              release/*.AppImage
              release/*.deb
              release/*.yml
              release/*.blockmap
              !release/builder-debug.yml
          - os: windows-latest
            target: win
            artifact-glob: |
              release/*.exe
              release/*.yml
              release/*.blockmap
              !release/builder-debug.yml
          - os: macos-latest
            target: mac
            # The system-audio helper (native/) is a Swift binary compiled on
            # the runner; only this job has a Swift toolchain, and only the mac
            # app ships the helper. `native: true` is what gates that step —
            # the other two jobs never invoke it.
            native: true
            # macos-latest runners are Apple Silicon, and the helper `swift
            # build` produces is host-arch only — an x64 app would ship an
            # arm64 binary that can't run on the Intel Mac it was built for.
            # So this is deliberately an arm64-only build; Intel support means
            # first making the helper a universal binary.
            extra-args: --arm64
            # *.zip alongside the *.dmg is not optional: latest-mac.yml points
            # electron-updater at the zip, and a dmg-only release leaves the
            # macOS auto-updater with nothing it can download.
            artifact-glob: |
              release/*.dmg
              release/*.zip
              release/*.yml
              release/*.blockmap
              !release/builder-debug.yml
    runs-on: ${{ matrix.os }}
    env:
      # Read by scripts/electron-builder-config.cjs (product name, appId, icon,
      # artifact names) and stamped into the packaged app as `buildChannel`.
      CRYSTAL_CHANNEL: ${{ needs.check.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Kept out of `bun run build` so the Windows and Linux jobs skip it
      # outright rather than shelling into a script that has nothing to do.
      # It only has to precede packaging — electron-builder.yml's `mac` block
      # copies the compiled binary in as a resource.
      - name: Build the macOS system-audio helper
        if: matrix.native
        run: bun run build:native

      # Exported here rather than in the job's `env:` because an unset secret
      # arrives as an empty string, and CSC_LINK="" is not the same to
      # electron-builder as CSC_LINK being absent — it would try to import a
      # certificate that isn't there. Nothing is exported when the secrets
      # aren't configured, which is what selects the ad-hoc branch in
      # scripts/electron-builder-config.cjs.
      - name: Configure macOS code signing
        if: matrix.native
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$MAC_CSC_LINK" ]; then
            echo "No Developer ID certificate configured (MAC_CSC_LINK)."
            echo "The app will be ad-hoc signed: valid, but not trusted by"
            echo "Gatekeeper — a downloaded copy needs Open Anyway, or"
            echo "xattr -dr com.apple.quarantine /Applications/Crystal.app"
            exit 0
          fi

          # The certificate is imported here rather than by handing
          # electron-builder CSC_LINK, because electron-builder's own keychain
          # setup is broken: createKeychain() locks the temporary keychain with
          # a random password, then importCerts() passes the *certificate*
          # password to `security set-key-partition-list -k`, which wants the
          # *keychain* password. It fails with "SecKeychainUnlock: The user
          # name or passphrase you entered is not correct" and takes the build
          # with it. Present in 26.15.3 and still in 26.15.7, so there is no
          # version to upgrade to.
          #
          # Doing it ourselves is also less machinery: electron-builder skips
          # createKeychain entirely when CSC_LINK is unset, and finds the
          # identity through the normal keychain search list.
          KEYCHAIN="$RUNNER_TEMP/crystal-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developerID.p12"

          echo "$MAC_CSC_LINK" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No argument = no auto-lock timeout. A keychain that re-locks
          # part-way through signing fails the build in a way that reads as a
          # certificate problem.
          security set-keychain-settings "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          # -k takes the KEYCHAIN password. This is the line electron-builder
          # gets wrong.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          # Derived from what was actually imported rather than hardcoded, so a
          # re-issued certificate needs no workflow edit. The
          # "Developer ID Application: " prefix is stripped deliberately —
          # electron-builder rejects a CSC_NAME carrying it.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate."
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "CSC_NAME=$IDENTITY" >> "$GITHUB_ENV"
          echo "Developer ID signing enabled for: $IDENTITY"

          # Notarization is a separate opt-in: signing alone stops the
          # "damaged" error, but only a notarized app opens without the user
          # being asked to override Gatekeeper. @electron/notarize engages off
          # these three variables.
          if [ -n "$MAC_APPLE_ID" ]; then
            {
              echo "APPLE_ID=$MAC_APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$MAC_APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$MAC_APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Notarization enabled."
          else
            echo "No Apple ID configured — signing without notarization."
          fi

      - name: Build app
        run: bun run build

      # The channel table is the source of truth for tag prefixes; the `check`
      # job had to mirror it before anything was compiled. Now that it is,
      # confirm the two still agree rather than publishing a tag no installed
      # build will ever look for.
      - name: Verify tag matches the channel table
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          node -e "
            const { CHANNELS } = require('./dist-electron/channels.js');
            const channel = CHANNELS[process.env.CRYSTAL_CHANNEL];
            if (!channel) throw new Error('Unknown channel: ' + process.env.CRYSTAL_CHANNEL);
            const expected = channel.tagPrefix + require('./package.json').version;
            if (expected !== process.env.TAG) {
              throw new Error('Workflow computed tag ' + process.env.TAG + ', channels.ts expects ' + expected);
            }
            console.log('tag ' + expected + ' matches channels.ts');
          "

      - name: Package (${{ matrix.target }})
        run: bunx electron-builder --${{ matrix.target }} ${{ matrix.extra-args }} --config scripts/electron-builder-config.cjs --publish never

      # The failure this guards against ships silently: electron-builder logs
      # "skipped macOS application code signing" as a warning and produces a
      # .dmg like nothing happened, but the bundle inside carries only the
      # prebuilt Electron binary's inherited signature, which doesn't seal the
      # Info.plist or Resources that electron-builder just rewrote. macOS
      # reports that as "Crystal.app is damaged and cannot be opened", so the
      # first person to find out is a user who can't launch the app. This is
      # the exact check that fails on such a bundle.
      #
      # It asserts validity, not trust: `spctl` still rejects an ad-hoc build
      # for want of a Developer ID, which is expected until the signing
      # secrets exist.
      - name: Verify the macOS signature
        if: matrix.native
        run: |
          set -euo pipefail
          APP="$(find release -maxdepth 2 -type d -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle found under release/."
            exit 1
          fi
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"

          # A signed build has more to prove than a valid seal. Without this,
          # a misconfigured secret degrades silently to ad-hoc and ships as if
          # nothing were wrong — which is the failure mode this whole step
          # exists to catch.
          if [ -n "${CSC_NAME:-}" ]; then
            if ! codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "^Authority=Developer ID Application:"; then
              echo "::error::CSC_NAME was set but the app is not Developer ID signed."
              exit 1
            fi
            echo "Developer ID signature confirmed."

            # A signed build runs under the hardened runtime, which silently
            # blocks the microphone unless the entitlement is present — the app
            # launches, joins a call and sends nothing. Chromium captures in a
            # helper process, so the main bundle alone proves nothing; every
            # signed component is checked.
            for BINARY in "$APP" "$APP"/Contents/Frameworks/*.app; do
              [ -e "$BINARY" ] || continue
              if ! codesign -d --entitlements :- "$BINARY" 2>/dev/null \
                   | grep -q "com.apple.security.device.audio-input"; then
                echo "::error::$(basename "$BINARY") is missing com.apple.security.device.audio-input — the microphone will not work."
                exit 1
              fi
            done
            echo "Microphone entitlement present on the app and its helpers."

            if [ -n "${APPLE_ID:-}" ]; then
              # Checks for a stapled notarization ticket, and asks Gatekeeper
              # for the verdict a user's Mac will reach on first launch.
              xcrun stapler validate "$APP"
              spctl -a -vvv -t exec "$APP"
              echo "Notarized, stapled and accepted by Gatekeeper."
            fi
          else
            echo "Ad-hoc build — spctl will reject it by design; not asserting trust."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.channel_label }} v${{ needs.check.outputs.current_version }}
          target_commitish: ${{ github.sha }}
          # The macOS build is ad-hoc signed rather than notarized, so macOS
          # asks before opening it. Saying so here is the difference between a
          # known first-launch step and an app that looks broken.
          body: |
            ## Install

            **Windows** — `Crystal-Setup-${{ needs.check.outputs.current_version }}.exe`
            **Linux** — `Crystal-${{ needs.check.outputs.current_version }}.AppImage` or `.deb`
            **macOS** (Apple Silicon) — `Crystal-${{ needs.check.outputs.current_version }}.dmg`

            ### Opening the macOS build the first time

            This build is signed, but not with a paid Apple Developer ID, so
            macOS can't check it with Apple and won't open it on a double-click.
            Once, after dragging Crystal to Applications:

            **System Settings → Privacy & Security**, scroll to Security, and
            click **Open Anyway** next to the message about Crystal.

            Or from a terminal:

            ```
            xattr -dr com.apple.quarantine /Applications/Crystal.app
            ```

            Every launch after that is normal.
          # Only Stable is a real release. The rest are prereleases, which is
          # what keeps them out of "latest" — and out of a Stable install's
          # update check.
          prerelease: ${{ needs.check.outputs.prerelease }}
          make_latest: ${{ needs.check.outputs.channel == 'stable' }}
          files: dist/**/*
